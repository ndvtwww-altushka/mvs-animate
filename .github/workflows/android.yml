name: Android build

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK; the third-party
      # setup-android action only added a failure point of its own.
      - name: Locate Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls "$SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1); fi
          if [ ! -x "$SM" ]; then SM=$(command -v sdkmanager || true); fi
          echo "sdkmanager=$SM"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SM" >> "$GITHUB_ENV"

      - name: Install platform and build tools
        run: |
          set -euo pipefail
          echo "sdk.dir=$SDK" > local.properties
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The APK comes first: a failing unit test must not hide a buildable app.
      - name: Build debug APK
        run: |
          # GitHub runs the script with -e, which aborted the pipeline before the
          # failure could be reported.
          set +e
          set -uo pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Job logs are not readable from the API, annotations are. Nothing is filtered:
            # pattern matching already missed one real failure.
            tail -n 25 build.log | sed "s/::/--/g" | while IFS= read -r line; do
              echo "::error title=assembleDebug::$line"
            done || true
          fi
          exit "$status"

      - name: Show APK
        run: ls -l app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mvs-animate-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Artifact links need a GitHub login; a release asset is a plain APK link.
      - name: Publish APK to a release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk mvs-animate-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" \
            "mvs-animate-${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" \
            --title "mvs-animate build ${{ github.run_number }}" \
            --notes "Debug APK from commit ${{ github.sha }} (run ${{ github.run_id }})." \
            --latest

      - name: Run unit tests
        run: |
          set +e
          set -uo pipefail
          gradle testDebugUnitTest --console=plain 2>&1 | tee test-run.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Job logs are not readable from the API, annotations are.
            grep -E "^(.*> Task .* FAILED|.*e: |.*error:|FAILED|.*tests? completed.*failed)" test-run.log | head -n 8 | while IFS= read -r line; do
              echo "::error title=unit-test::$line"
            done || true
            grep -A2 -E "FAILED" test-run.log | grep -E "AssertionError|Exception|expected" | head -n 4 | while IFS= read -r line; do
              echo "::error title=unit-test::$line"
            done || true
          fi
          exit "$status"

      - name: Test report
        if: always()
        run: |
          ls -R app/build/reports/tests/testDebugUnitTest 2>/dev/null | head -n 20 || true
